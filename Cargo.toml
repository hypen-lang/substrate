[package]
name = "substrate-liquid"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A transactional prototype of Liquid SQL's composable relational model"
license = "MIT OR Apache-2.0"

[dependencies]
im = "15.1.0"
redb = "3.1.3"
rusqlite = { version = "0.32.1", features = ["bundled", "vtab", "modern_sqlite", "hooks", "limits"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.21"
uuid = { version = "1.23.1", features = ["v4", "serde"] }

rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"
subtle = "2.6.1"
mio = { version = "1.2.3", features = ["os-poll", "net"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

# Optimized execution with symbols for native sampling profilers.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "sqlite"
harness = false

[[bench]]
name = "recovery"
harness = false

[[bench]]
name = "nested"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "schema_install"
harness = false
