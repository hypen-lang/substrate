[package]
name = "substrate-storage-experiment"
version = "0.1.0"
edition = "2024"
publish = false

[features]
rocks = ["dep:rocksdb"]

[dependencies]
redb = "=3.1.3"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
rocksdb = { version = "=0.25.0", default-features = false, features = ["bindgen-runtime"], optional = true }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[workspace]
